# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered

# shellcheck shell=sh
# shellcheck disable=SC2034  # ci/reload.sh reads these after sourcing this file

RELOAD_HTTP="
    footer_types text/plain;"

RELOAD_SERVER="
        location /probe {
            default_type text/plain;
            footer \"[reloaded]\";
            return 200 \"body\";
        }"

# Only this module appends that text, so a worker left over from the cycle
# before answers without it.
RELOAD_EXPECT='body[reloaded]'

reload_probe() {
	curl -s --max-time 5 "http://127.0.0.1:$PORT/probe"
}
